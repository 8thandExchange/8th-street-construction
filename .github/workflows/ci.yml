name: Verify application

on:
  pull_request:
  push:
    branches: [main]
  # Manual re-run for when a pull_request webhook is dropped (it happens:
  # PR #84's opened event produced no run) — Actions → Verify application →
  # Run workflow, pick the branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      # `secrets` is not a legal context in a step `if:`, but `env` is — so the
      # token is promoted here and the drift steps branch on the env var.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - name: Production build
        if: ${{ env.NEXT_PUBLIC_SUPABASE_URL != '' && env.NEXT_PUBLIC_SUPABASE_ANON_KEY != '' }}
        run: npm run build
      - name: Explain skipped build
        if: ${{ env.NEXT_PUBLIC_SUPABASE_URL == '' || env.NEXT_PUBLIC_SUPABASE_ANON_KEY == '' }}
        run: echo "Build skipped until NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY repository variables are configured."
      # The committed types were regenerated against the live schema on
      # 2026-08-26, so drift now fails the build — a migration must land with
      # its regenerated types. Scope is public only: nothing imports the
      # graphql_public types, and the narrower scope keeps this diff stable.
      - name: Database type drift
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        run: |
          npx supabase gen types typescript --project-id rqmrqndjbkpkewfpyegv --schema public > /tmp/database.generated.ts
          diff -u src/types/database.generated.ts /tmp/database.generated.ts
      - name: Explain skipped type drift
        if: ${{ env.SUPABASE_ACCESS_TOKEN == '' }}
        run: echo "Type drift check skipped until SUPABASE_ACCESS_TOKEN is configured."
